global:
  resolve_timeout: 1m

route:
  receiver: "remediation-webhook"
  group_by: ["alertname"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1m

receivers:
  - name: "remediation-webhook"
    webhook_configs:
      - url: "http://remediation_engine:5001/webhook"
        send_resolved: true